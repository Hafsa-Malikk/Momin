let nijaatScenario=null,nijaatFollowupIdx=0,nijaatAnswers=[],nijaatAudioUrl='',nijaatRole=null,nijaatRealTranscript=null,nijaatRealConfidence=null,nijaatAIGuidance='';

function categoryToNijaatKey(cat){for(const k in nijaatCategoryMap){if(nijaatCategoryMap[k]===cat)return k}return 'Other'}
let coachFollowupIdx=0;
function nijaatCoachStart(){show('<div class="hero-agent"><h2>🛡️ Nijaat AI</h2><p class="muted">Talk through how to help — in English or Urdu.</p><button id="mic" class="mic-btn">🎙️<br>Tap to talk</button><p class="preview">Describe what you\'re seeing so Nijaat can guide you. Recording uses your real microphone; understanding is simulated for this demo.</p></div>'+backBtn('Back to alert'));setupCoachMic();button('backNav',support)}
function setupCoachMic(){const mic=document.getElementById('mic');mic.onclick=async()=>{if(activeRecorder&&activeRecorder.state==='recording'){activeRecorder.stop();return}try{stopCapture();captureStream=await navigator.mediaDevices.getUserMedia({audio:true});const recorder=new MediaRecorder(captureStream);activeRecorder=recorder;mic.classList.add('listening');mic.innerHTML='🔴<br>Listening… tap to stop';recorder.ondataavailable=()=>{};recorder.onstop=()=>{captureStream.getTracks().forEach(t=>t.stop());activeRecorder=null;coachFollowupIdx=0;nijaatCoachFollowup()};recorder.start()}catch{coachFollowupIdx=0;nijaatCoachFollowup()}}}
function nijaatCoachFollowup(){const key=categoryToNijaatKey(category);const d=nijaatData[key];const list=d.followupsWitness||d.followupsSelf;if(coachFollowupIdx>=Math.min(2,list.length)){nijaatCoachGuidance();return}const q=list[coachFollowupIdx];show('<h2>Quick question '+(coachFollowupIdx+1)+' of '+Math.min(2,list.length)+'</h2><div class="bubble agent">'+q.en+'<div class="ur">'+q.ur+'</div></div>'+q.options.map((o,i)=>'<button class="row" id="opt'+i+'">'+o+'</button>').join(''));q.options.forEach((o,i)=>button('opt'+i,()=>{coachFollowupIdx++;nijaatCoachFollowup()}))}
function nijaatCoachGuidance(){const key=categoryToNijaatKey(category);const d=nijaatData[key];show('<h2>Here\'s how you can help</h2>'+d.guidance.map((g,i)=>'<div class="bubble agent"><span class="step-num">'+(i+1)+'</span>'+g.en+'<div class="ur">'+g.ur+'</div></div>').join('')+'<p class="muted">Ask Nijaat anything else, or let it know you\'re done.</p><button id="askMore" class="row">🎙️ Ask something else<small>Keep talking to Nijaat</small></button><button id="done" class="full primary">✅ I\'m done — that helped</button>');button('askMore',nijaatCoachStart);button('done',incoming)}
let momStream=null,momRecorder=null,momAudioCtx=null,momAnalyser=null,momChunks=[],momConversation=[],momCurrentAudio=null,momAudioEl=null,momActiveRecognizer=null;

function momCleanup(){if(momActiveRecognizer){try{momActiveRecognizer.stop()}catch(e){}momActiveRecognizer=null}if(momRecorder&&momRecorder.state==='recording'){try{momRecorder.stop()}catch(e){}}if(momStream){momStream.getTracks().forEach(t=>t.stop());momStream=null}if(momCurrentAudio){momCurrentAudio.pause();momCurrentAudio=null}if(momAudioCtx){try{momAudioCtx.close()}catch(e){}momAudioCtx=null}}

function momAppendBubble(role,text){const chat=document.getElementById('momChat');if(!chat)return;const div=document.createElement('div');div.className='bubble '+(role==='user'?'user':'agent');div.textContent=text;chat.append(div);chat.scrollTop=chat.scrollHeight}

async function momBeginTurn(){const status=document.getElementById('momStatus');if(!momAudioEl){momAudioEl=new Audio();momAudioEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';momAudioEl.play().catch(()=>{});momAudioEl.pause()}if(!momStream){try{momStream=await navigator.mediaDevices.getUserMedia({audio:true});momAudioCtx=new(window.AudioContext||window.webkitAudioContext)();const source=momAudioCtx.createMediaStreamSource(momStream);momAnalyser=momAudioCtx.createAnalyser();momAnalyser.fftSize=512;source.connect(momAnalyser)}catch(e){if(status)status.textContent='Microphone access denied. Allow microphone access and retry.';return}}momRecordTurn()}

function momRecordTurn(){const mic=document.getElementById('mic');const status=document.getElementById('momStatus');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){if(status)status.textContent='Voice recognition needs a Chrome-based browser (desktop or Android).';return}if(mic){mic.classList.add('listening');mic.innerHTML='🔴<br>Listening…'}if(status)status.textContent='Listening…';const recognizer=new SR();momActiveRecognizer=recognizer;recognizer.lang=momPreferredLang==='ur'?'ur-PK':'en-US';recognizer.interimResults=false;recognizer.maxAlternatives=1;recognizer.onresult=e=>{const transcript=e.results[0][0].transcript;if(mic){mic.classList.remove('listening');mic.innerHTML='🎙️<br>Tap to talk'}if(status)status.textContent='Thinking…';momSendTurn(transcript)};recognizer.onerror=e=>{if(mic){mic.classList.remove('listening');mic.innerHTML='🎙️<br>Tap to talk'}momActiveRecognizer=null;if(e.error==='not-allowed'){if(status)status.textContent='Microphone access denied. Allow microphone access and retry.'}else if(status)status.textContent='Didn\'t catch that — tap the mic and try again.'};recognizer.onend=()=>{momActiveRecognizer=null;if(mic&&mic.classList.contains('listening')){mic.classList.remove('listening');mic.innerHTML='🎙️<br>Tap to talk'}};recognizer.start()}

async function momSendTurn(transcript){const status=document.getElementById('momStatus');try{momConversation.push({role:'user',content:transcript});momAppendBubble('user',transcript);const res=await fetch('/api/converse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:momConversation,lang:momPreferredLang})});if(!res.ok)throw new Error('API error '+res.status);const data=await res.json();if(data.type==='complete'){momAppendBubble('agent',data.summary||'Got it — pulling together guidance now.');momFinishConversation(data)}else{const text=data.text||'Could you tell me a bit more?';momConversation.push({role:'assistant',content:text});momAppendBubble('agent',text);if(status)status.textContent='';await momSpeakAndListen(text)}}catch(err){if(status)status.textContent='Connection issue — tap the mic to try again.';const mic=document.getElementById('mic');if(mic)mic.onclick=momBeginTurn}}

async function momSpeakAndListen(text){const status=document.getElementById('momStatus');try{const res=await fetch('/api/tts?text='+encodeURIComponent(text));if(!res.ok)throw new Error('tts failed');const audioBlob=await res.blob();const url=URL.createObjectURL(audioBlob);const audioEl=momAudioEl||new Audio();audioEl.src=url;momCurrentAudio=audioEl;if(status)status.textContent='Momin is speaking… you can talk anytime to interrupt.';let interrupted=false;const data=new Uint8Array(momAnalyser.fftSize);const INTERRUPT_THRESHOLD=0.035;function watchForInterrupt(){if(interrupted||audioEl.paused||audioEl.ended)return;momAnalyser.getByteTimeDomainData(data);let sum=0;for(let i=0;i<data.length;i++){const v=(data[i]-128)/128;sum+=v*v}const rms=Math.sqrt(sum/data.length);if(rms>INTERRUPT_THRESHOLD){interrupted=true;audioEl.pause();URL.revokeObjectURL(url);momRecordTurn();return}requestAnimationFrame(watchForInterrupt)}audioEl.onended=()=>{URL.revokeObjectURL(url);if(!interrupted)momRecordTurn()};await audioEl.play();requestAnimationFrame(watchForInterrupt)}catch(e){if(status)status.textContent='';momRecordTurn()}}

function momFinishConversation(data){momCleanup();nijaatAIGuidance=data.guidance||'';const key=categoryToNijaatKey(data.category||'Other');nijaatScenario=key;category=nijaatCategoryMap[key];nijaatRole=data.role==='witness'?'witness':'self';reporterRole=nijaatRole;nijaatRealConfidence=typeof data.confidence==='number'?data.confidence:null;description=data.summary||momConversation.filter(m=>m.role==='user').map(m=>m.content).join(' ');nijaatAnswers=momConversation.filter(m=>m.role==='user').map(m=>m.content);const status=document.getElementById('momStatus');if(status)status.textContent='';setTimeout(nijaatValidate,600)}

function nijaatValidate(){const d=nijaatData[nijaatScenario];const aiBlock=nijaatAIGuidance?'<div class="bubble agent" style="white-space:pre-line">'+esc(nijaatAIGuidance)+'</div>':'';const staticBlock=nijaatAIGuidance?'':d.guidance.map((g,i)=>'<div class="bubble agent"><span class="step-num">'+(i+1)+'</span>'+g.en+'<div class="ur">'+g.ur+'</div></div>').join('');show('<h2>Stay calm — follow these steps</h2>'+aiBlock+staticBlock+'<button id="play" class="full">🔊 Play voice guidance</button><p id="playStatus" class="preview"></p><button id="next" class="full primary">Continue</button>');button('play',async()=>{const btn=document.getElementById('play');const st=document.getElementById('playStatus');const text=nijaatAIGuidance||d.guidance.map(g=>g.en).join(' ');btn.disabled=true;btn.textContent='🔊 Playing…';if(st)st.textContent='';try{const res=await fetch('/api/tts?text='+encodeURIComponent(text));if(!res.ok)throw new Error('tts failed');const blob=await res.blob();const url=URL.createObjectURL(blob);const audio=new Audio(url);audio.onended=()=>{URL.revokeObjectURL(url);btn.disabled=false;btn.textContent='🔊 Play voice guidance'};audio.onerror=()=>{btn.disabled=false;btn.textContent='🔊 Play voice guidance';if(st)st.textContent='Could not play audio.'};await audio.play()}catch(e){btn.disabled=false;btn.textContent='🔊 Play voice guidance';if(st)st.textContent='Voice guidance unavailable right now.'}});button('next',nijaatPhone)}

function nijaatPhone(){show('<h2>One more thing</h2><div class="bubble agent">Can you share a callback number and your location? If this is spread to community members nearby, they will see your number so they can call or text you, and responders need your location to find you.<div class="ur">کیا آپ رابطہ نمبر اور اپنا مقام بتا سکتے ہیں؟</div></div><label>Callback phone number · required<input id="nijaatPhoneInput" type="tel" autocomplete="tel" placeholder="Include country code" value="'+esc(phone)+'"></label><p id="phoneError" class="error" hidden>Please add a callback number to continue.</p><label>Your location · required</label><button id="nijaatLocate" class="full primary">◎ Share my location</button><div id="nijaatLocStatus" class="muted"></div><p id="locError" class="error" hidden>Please share your location to continue.</p><label>Photo or video · optional</label><p class="preview">Record what you\'re seeing right now. It stays protected — only verified responders and authorities can view it, and it can\'t be downloaded or screen-recorded from within this preview.</p><div class="actions"><button id="cameraPhoto">Camera photo</button><button id="cameraVideo">Camera video</button></div><video id="cameraPreview" autoplay muted playsinline hidden style="width:100%;margin-top:12px" class="no-capture"></video><button id="captureAction" class="full primary" hidden></button><button id="closeCamera" class="full" hidden>Close camera</button><p id="cameraStatus" role="status" class="muted"></p><div id="capturedMedia"></div><button id="next" class="full primary">Find nearest help</button>');setupCameraOnly();button('nijaatLocate',()=>{if(!navigator.geolocation){document.getElementById('nijaatLocStatus').textContent='Location is unavailable in this browser.';return}document.getElementById('nijaatLocStatus').textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{lat=String(pos.coords.latitude);lon=String(pos.coords.longitude);document.getElementById('nijaatLocStatus').innerHTML='<a href="'+locationLink()+'" target="_blank" rel="noopener">Location shared — check pin</a>';},()=>{document.getElementById('nijaatLocStatus').textContent='Location access failed or was denied. Allow location access and retry.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})});button('next',()=>{const val=document.getElementById('nijaatPhoneInput').value.trim();let ok=true;if(!val){document.getElementById('phoneError').hidden=false;ok=false}if(!lat){document.getElementById('locError').hidden=false;ok=false}if(!ok)return;phone=val;nijaatMaps()})}

function nijaatMaps(){const d=nijaatData[nijaatScenario];show('<h2>Nearest help</h2><div class="service-card"><h3>'+d.service.name+'</h3><p class="muted">'+d.service.distance+' away · ETA '+d.service.eta+'</p><a class="full urgent" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" href="tel:'+d.service.phone+'">📞 Call '+d.service.phone+'</a></div><p class="preview">Distance and ETA are sample data. Live routing needs the Google Maps API.</p><button id="next" class="full primary">Notify nearby community</button><button id="skip" class="full">Skip to summary</button>');button('next',nijaatCommunity);button('skip',nijaatSMS)}

function nijaatCommunity(){show('<h2>Pinging nearby helpers</h2><p class="muted">Preview: notifying 5 opted-in app users within 500 metres.</p><p class="preview">Your callback number ('+esc(phone||'not provided')+') is shared with them so they can call or text you directly.</p>'+(nijaatAudioUrl?'<div class="protected">Your original voice recording is attached<br><small>Responders can listen directly to assess the situation.</small><audio controls src="'+nijaatAudioUrl+'" class="no-capture" oncontextmenu="return false"></audio></div>':'<p class="preview">No recording captured this session — a sample scenario was used instead of your microphone.</p>')+(captureUrls.length?'<p class="preview">'+captureUrls.length+' photo/video item(s) attached — protected, view-only for verified responders.</p>':'')+'<div id="commList"></div><button id="next" class="full primary" disabled>Continue</button>');const names=['Ali (120m)','Sana (240m)','Bilal (310m)','Hina (410m)','Usman (480m)'];const list=document.getElementById('commList');names.forEach((n,i)=>{const row=document.createElement('div');row.className='community-item';row.innerHTML='<span>'+n+'</span><span class="tag-pending" id="stat'+i+'">Notified…</span>';list.append(row)});names.forEach((n,i)=>setTimeout(()=>{const el=document.getElementById('stat'+i);if(!el)return;const accepted=i!==3;el.textContent=accepted?'On the way':'No response';el.className=accepted?'tag-accepted':'tag-pending'},700+i*500));setTimeout(()=>{const btn=document.getElementById('next');if(btn){btn.disabled=false;button('next',nijaatSMS)}},700+names.length*500+300)}

function nijaatSMS(){const d=nijaatData[nijaatScenario];const msg='NIJAAT ALERT: '+d.label+' reported. Location: https://www.google.com/maps?q=31.5204,74.3587 — sent automatically from Vocal Emergency (preview).';show('<h2>Alert your family</h2><p class="muted">Auto-generated SMS to 3 emergency contacts. Edit before sending.</p><textarea id="smsText" rows="4">'+msg+'</textarea><button id="send" class="full urgent">Send to family · simulation</button><p id="sendStatus" class="preview"></p><button id="next" class="full">Continue to summary</button>');button('send',()=>{document.getElementById('sendStatus').textContent='Simulated: sent to 3 saved contacts.'});button('next',nijaatSummary)}

function nijaatSummary(){const d=nijaatData[nijaatScenario];show('<h2>Incident report generated</h2><div class="asset"><strong>'+d.label+'</strong><p>"'+d.transcript.en+'"</p><p>Callback number: '+esc(phone||'—')+'</p><p>Follow-up answers: '+(nijaatAnswers.join(' · ')||'—')+'</p><p>Guidance given: '+d.guidance.length+' steps</p><p>Nearest help: '+d.service.name+' ('+d.service.distance+')</p><small>Generated by Nijaat AI · preview only</small></div>'+(nijaatAudioUrl?'<label>Attached voice recording<audio controls src="'+nijaatAudioUrl+'"></audio></label><p class="preview">Included with the report so responders can hear exactly what was said, not just the AI\'s summary.</p>':'<p class="preview">No voice recording attached — a sample scenario was used instead of your microphone this session.</p>')+'<button id="download" class="full">Download report (preview)</button><button id="restart" class="full primary">Back to start</button>');button('restart',picker);button('download',()=>{document.getElementById('download').textContent='Report saved locally (simulation)'})}

function incoming(){show('<span class="category">'+esc(category)+'</span><h2>Emergency nearby</h2><div class="protected"><strong>Abubakar Farooq · Caller</strong><p class="muted">Mechatronics Engineer</p><p class="muted">'+(reporterRole==='witness'?'Reported by a bystander, on behalf of the person affected.':'Reported directly by the person affected.')+'</p><p>Profile and email are sample account data in this preview.</p><p>Phone: <a href="tel:'+esc(phone.replace(/[^+0-9]/g,''))+'">'+esc(phone||'Not provided in sample alert')+'</a></p><p>Email: abubakar@example.com</p></div><p>'+esc(description||'Sample report awaiting help at the pinned location.')+'</p><div class="protected">Voice note · 12 seconds<br><small>Sample audio placeholder</small></div><div class="protected">🔒 Protected original media<br><small>Not downloadable or shareable. Access restricted to authorized verified in-person responders and relevant authorities. No original media is loaded in this preview.</small></div><button id="optout" class="icon-row"><span class="row-icon">🚫</span><span><strong>Already in an emergency</strong><small>Opt out immediately. No penalty.</small></span></button><button id="inperson" class="icon-row"><span class="row-icon">🏃</span><span><strong>In-person help</strong><small>Review your commitment before confirming.</small></span></button><button id="spread" class="icon-row"><span class="row-icon">📢</span><span><strong>Spread the word</strong><small>Share a generated asset or contact someone who can help.</small></span></button><button id="reportFalse" class="icon-row"><span class="row-icon">🚩</span><span><strong>Report suspected false alarm</strong><small>Submit concerns for human review, not an automatic verdict.</small></span></button><label>Shareable location link<input readonly value="'+locationLink()+'"></label><button id="copyLoc" class="full">Copy location link</button>');button('copyLoc',()=>copyLocation('copyLoc'));button('reportFalse',()=>reportSuspected());button('optout',()=>{show('<h2>You have opted out</h2><p>No penalty. Focus on the emergency you are already handling.</p>'+backBtn('Back to preview'));button('backNav',incoming)});button('inperson',commit);button('spread',()=>{route='spread';support()})}
let responderPhone='',responderLat='',responderLon='';
function commit(){show('<span class="category">'+esc(category)+'</span><h2>Confirm in-person help</h2><p>You are committing to attend this emergency.</p><p class="muted">If you do not follow through, your account may be temporarily blocked pending your explanation and human review. A Connects fine may apply.</p><label>Your phone number · required<input id="responderPhoneInput" type="tel" autocomplete="tel" placeholder="Include country code" value="'+esc(responderPhone)+'"></label><p class="muted">The reporter will see this number so they can call or text you to check in.</p><label>Live location · required</label><button id="shareLoc" class="full primary">◎ Share my live location</button><p class="preview">The reporter will be able to see your live location and estimated arrival while you\'re on the way.</p><div id="locStatus" class="muted"></div><p id="commitError" class="error" hidden></p><button id="confirm" class="full urgent">Confirm my commitment · simulation</button>'+backBtn('Go back')+'');button('shareLoc',()=>{if(!navigator.geolocation){document.getElementById('locStatus').textContent='Location is unavailable in this browser.';return}document.getElementById('locStatus').textContent='Finding your location…';navigator.geolocation.getCurrentPosition(pos=>{responderLat=String(pos.coords.latitude);responderLon=String(pos.coords.longitude);document.getElementById('locStatus').textContent='Live location shared. Reported accuracy: '+Math.round(pos.coords.accuracy)+' metres.';},()=>{document.getElementById('locStatus').textContent='Location access failed or was denied. Allow location access and retry.'},{enableHighAccuracy:true,timeout:15000,maximumAge:0})});button('confirm',()=>{responderPhone=document.getElementById('responderPhoneInput').value.trim();if(!responderPhone||!responderLat){const err=document.getElementById('commitError');err.hidden=false;err.textContent='Add your phone number and share your live location before confirming.';return}trackerResponders.unshift({name:'You (Responder)',phone:responderPhone,status:'On the way',eta:'8 minutes',loc:responderLat+','+responderLon});route='inperson';support()});button('backNav',incoming)}
function support(){show('<span class="category">'+esc(category)+'</span><h2>'+ (route==='spread'?'Spread the word':'In-person commitment recorded')+'</h2><p class="muted">'+(route==='spread'?'Share the prepared information with your circle or an appropriate contact.':'Simulation only. Check the location at the bottom of the alert and prepare to follow through.')+'</p><button id="coach" class="row">🛡️ Talk to Nijaat AI<small>Get step-by-step guidance in English or Urdu to help safely.</small></button>'+(route==='spread'?'<button id="assets" class="full primary">View generated sharing assets</button>':'')+backBtn('Back to alert')+'');button('coach',nijaatCoachStart);if(route==='spread')button('assets',assets);button('backNav',incoming)}
function assets(){show('<h2>Ready-to-share assets</h2><p class="muted">Only category, description and location appear publicly. Original photos and videos are excluded.</p><h3>Voice-note video</h3><div class="asset"><strong>'+esc(category)+'</strong><p>'+esc(description||'Emergency reported at the linked location.')+'</p><small>'+locationLink()+'</small><p>▶ Voice note · 0:00 / 0:12</p></div><p class="preview">White-background video storyboard. No video has been generated.</p><button id="downloadVideo" class="full primary">Download voice-note video</button><p id="videoStatus" class="preview"></p><h3>Text-only card reference</h3><div class="desc-block"><div class="asset"><strong>Emergency report</strong><p>'+esc(description||'Help requested at the pinned location.')+'</p><small>'+locationLink()+'</small></div><button id="downloadEn" class="desc-download" title="Download as image" aria-label="Download English card as image">⬇</button></div><div class="desc-block"><div class="asset" lang="ur" dir="rtl"><strong>ہنگامی اطلاع</strong><p>نشان زدہ مقام پر مدد درکار ہے۔</p><small dir="ltr">'+locationLink()+'</small></div><button id="downloadUr" class="desc-download" title="Download as image" aria-label="Download Urdu card as image">⬇</button></div><p class="preview">Urdu is sample text, not an automatic translation.</p><label>Shareable location link<input readonly value="'+locationLink()+'"></label><button id="assetCopy" class="full">Copy location link</button>'+backBtn('Back to response')+'');button('backNav',support);button('assetCopy',()=>copyLocation('assetCopy'));button('downloadEn',()=>downloadCard('en'));button('downloadUr',()=>downloadCard('ur'));button('downloadVideo',downloadVideo)}
function cooldown(role){const witness=role==='witness';show('<h2>Tell us what happened</h2><p>Someone has questioned an emergency you reported. This does not mean you made a false report.</p><div class="status"><h3>Your account is paused for 1 day</h3><p>This is the review cooldown. Please explain what you saw so a human reviewer can understand the situation.</p></div><h3>What to include</h3><p class="muted">'+(witness?'What did you see happening to someone else? Why did you think they needed help? Where were you standing?':'What did you experience? Why did you ask for help? Did anything change before help arrived?')+'</p><label>Your explanation · required<textarea id="explanation" placeholder="'+(witness?'I saw this happening to someone else and reported it because… What I observed was…':'I reported the emergency because… When help arrived…')+'"></textarea></label><button id="explain" class="full primary">Send my explanation · preview</button><p id="error" class="error" hidden>Please provide an explanation.</p>');button('explain',()=>{if(!document.getElementById('explanation').value.trim()){document.getElementById('error').hidden=false;return}show('<h2>Your explanation is ready for review</h2><p>A human reviewer will look at your explanation and the report before deciding what happened. AI cannot decide your penalty or account status.</p><div class="status"><h3>What happens next?</h3><p>You will receive a decision explaining whether the report was reasonable, an honest mistake, or deliberately false. No decision has been made here.</p></div><p class="preview">Preview each possible reviewer outcome below. These are not choices offered to the caller in the real flow.</p><div id="outcomes"></div>');const target=document.getElementById('outcomes');['Cleared','Honest wrong assessment','Malicious/mockery'].forEach((label,i)=>{const b=document.createElement('button');b.className='row';b.textContent='Preview: '+label;b.onclick=()=>outcome(i);target.append(b)})})}
function outcome(i){const data=[['Cleared','No penalty. No fine or strike. Your account resumes normally.',''],['Honest wrong assessment','A Connects fine is required to reactivate your account. Fine amount is not yet defined. This example records strike 1 of 3. A fourth wrong assessment results in a permanent ban.',''],['Account permanently banned','Human review determined malicious or deliberately false reporting. No fine or reactivation path applies.','ban']][i];show('<h2>'+data[0]+'</h2><div class="status '+data[2]+'"><p>'+data[1]+'</p></div>'+(i===1?'<button disabled class="full">Fine amount pending definition</button>':'')+'<p class="preview">Simulated human-review outcome.</p>')}

async function copyLocation(id){try{await navigator.clipboard.writeText(locationLink());document.getElementById(id).textContent='Location copied'}catch{document.getElementById(id).textContent='Select and copy the location link above'}}
function saveBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function cardCanvas(lang){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,1080,1080);ctx.fillStyle='black';ctx.font='bold 42px sans-serif';ctx.fillText(category,60,90);ctx.font='32px sans-serif';ctx.direction=lang==='ur'?'rtl':'ltr';ctx.textAlign=lang==='ur'?'right':'left';const text=lang==='ur'?'نشان زدہ مقام پر مدد درکار ہے۔':(description||'Help requested at the pinned location.');let line='',y=175;for(const word of text.split(/\s+/)){if(ctx.measureText(line+word).width>930){ctx.fillText(line,lang==='ur'?1020:60,y);y+=48;line='';}line+=word+' ';}ctx.fillText(line,lang==='ur'?1020:60,y);ctx.direction='ltr';ctx.textAlign='left';ctx.font='22px sans-serif';ctx.fillText(locationLink(),60,1000,960);return canvas}
function downloadCard(lang){cardCanvas(lang).toBlob(blob=>saveBlob(blob,'vocal-description-'+lang+'.png'),'image/png')}
async function downloadVideo(){const status=document.getElementById('videoStatus');if(!audioUrl){status.textContent='Attach a real voice note in the Caller form first. The sample has no audio to export.';return}if(!window.MediaRecorder){status.textContent='Video creation is unsupported in this browser.';return}let ac,stream;try{const source=new Audio(audioUrl);await new Promise((resolve,reject)=>{source.onloadedmetadata=resolve;source.onerror=reject});const canvas=cardCanvas('en');stream=canvas.captureStream(1);ac=new AudioContext();const node=ac.createMediaElementSource(source);const dest=ac.createMediaStreamDestination();node.connect(dest);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));const mime=['video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime)throw Error('Unsupported format');const rec=new MediaRecorder(stream,{mimeType:mime});const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{saveBlob(new Blob(chunks,{type:mime}),'vocal-voice-note.webm');stream.getTracks().forEach(t=>t.stop());ac.close();status.textContent='Voice-note video downloaded.'};source.onended=()=>rec.stop();await ac.resume();rec.start();await source.play();status.textContent='Creating video locally. Keep this screen open until the voice note ends.'}catch{status.textContent='Video could not be created in this browser. Your voice note has not been uploaded.';if(stream)stream.getTracks().forEach(t=>t.stop());if(ac)ac.close()}}
function reportSuspected(returnTo){returnTo=returnTo||incoming;show('<h2>Report suspected false alarm</h2><p>Report linked to the caller and this alert. A human reviewer assesses the evidence.</p><label>Reason<textarea id="reportReason" placeholder="I went to the location and…"></textarea></label><button id="sendReport" class="full urgent">Submit report · simulation</button><button id="cancelReport" class="full">Cancel</button>');button('cancelReport',returnTo);button('sendReport',()=>{if(!document.getElementById('reportReason').value.trim())return;show('<h2>Report sent for review · simulation</h2><p>No verdict has been issued. No account action occurs in this preview.</p><button id="returnAlert" class="full">Return</button>');button('returnAlert',returnTo)})}


var captureStream=null,activeRecorder=null,captureUrls=[];
function stopCapture(){if(activeRecorder&&activeRecorder.state==='recording')activeRecorder.stop();if(captureStream)captureStream.getTracks().forEach(t=>t.stop());captureStream=null;activeRecorder=null}
async function openCamera(mode){const status=document.getElementById('cameraStatus');stopCapture();try{captureStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:mode==='video'});const preview=document.getElementById('cameraPreview');preview.srcObject=captureStream;preview.hidden=false;await preview.play();const action=document.getElementById('captureAction');action.hidden=false;document.getElementById('closeCamera').hidden=false;action.textContent=mode==='photo'?'Take photo':'Start video';status.textContent='Camera ready. Captured media stays local in this preview.';
action.onclick=()=>{if(mode==='photo'){const canvas=document.createElement('canvas');canvas.width=preview.videoWidth;canvas.height=preview.videoHeight;if(!canvas.width)return;canvas.getContext('2d').drawImage(preview,0,0);canvas.toBlob(blob=>{if(blob)addMedia(blob,'photo')},'image/jpeg');closeCamera();}else if(activeRecorder&&activeRecorder.state==='recording'){activeRecorder.stop();}else{const chunks=[];const recorder=new MediaRecorder(captureStream);activeRecorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{addMedia(new Blob(chunks,{type:recorder.mimeType}),'video');activeRecorder=null;closeCamera()};recorder.start();action.textContent='Stop video';status.textContent='Recording video…';}};
}catch{stopCapture();status.textContent='Camera unavailable or permission denied. Allow camera access and retry.'}}
function closeCamera(){stopCapture();const preview=document.getElementById('cameraPreview');preview.srcObject=null;preview.hidden=true;document.getElementById('captureAction').hidden=true;document.getElementById('closeCamera').hidden=true}
function addMedia(blob,type){const url=URL.createObjectURL(blob);captureUrls.push(url);const media=document.createElement(type==='photo'?'img':'video');media.src=url;media.className='no-capture';media.oncontextmenu=()=>false;media.style.cssText='width:100%;margin-top:12px;pointer-events:none';if(type==='photo')media.alt='Captured emergency photo';else{media.controls=true;media.style.pointerEvents='auto';media.playsInline=true}const wrap=document.createElement('div');wrap.style.cssText='position:relative';wrap.append(media);const wm=document.createElement('div');wm.textContent='Vocal Emergency · Protected';wm.style.cssText='position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.5);color:#2B2A25;font-size:10px;padding:2px 6px;border-radius:4px;pointer-events:none';wrap.append(wm);document.getElementById('capturedMedia').append(wrap);document.getElementById('cameraStatus').textContent='Captured '+type+' attached locally. Excluded from public sharing assets.'}
function setupCapture(){
 const record=document.getElementById('liveRecord');
 record.onclick=async()=>{const status=document.getElementById('recordStatus');if(activeRecorder&&activeRecorder.state==='recording'){activeRecorder.stop();return}try{stopCapture();captureStream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const recorder=new MediaRecorder(captureStream);activeRecorder=recorder;const localStream=captureStream;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{localStream.getTracks().forEach(t=>t.stop());activeRecorder=null;const blob=new Blob(chunks,{type:recorder.mimeType});if(!blob.size){status.textContent='No audio captured. Please record again.';return}if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(blob);voice=true;const player=document.getElementById('recordPlayback');if(player){player.src=audioUrl;player.hidden=false;record.textContent='Record again';status.textContent='Voice note ready. Listen before submitting.';document.getElementById('record').textContent='Recorded voice note attached'}};recorder.start();record.textContent='Stop recording';status.textContent='Recording… press Stop when finished.'}catch{stopCapture();status.textContent='Microphone unavailable or permission denied. Allow microphone access and try again.'}};
 button('cameraPhoto',()=>openCamera('photo'));button('cameraVideo',()=>openCamera('video'));button('closeCamera',closeCamera);
}
function setupCameraOnly(){button('cameraPhoto',()=>openCamera('photo'));button('cameraVideo',()=>openCamera('video'));button('closeCamera',closeCamera)}



function reviewHome(){show('<h2>Emergency review</h2><p class="muted">You would only land on the sections below after being contacted about a specific alert — either your own report was questioned, or a commitment you made wasn\'t completed. Browsing here does not start anything.</p><h3>Track your report</h3><p class="muted">If you\'ve already reported an emergency, see who has responded, get their number, and follow their live location.</p><button id="trackReport" class="icon-row"><span class="row-icon">🚨</span><span><strong>See who\'s responding</strong><small>View responder details and live location for your last report.</small></span></button><h3>Choose a preview</h3><button id="reviewCaller" class="icon-row"><span class="notif-dot">2</span><span><strong>I reported an emergency</strong><small>Someone questioned my report — I need to explain what happened.</small></span></button><button id="reviewResponder" class="icon-row"><span class="notif-dot">1</span><span><strong>I offered in-person help</strong><small>I committed to attend but could not follow through.</small></span></button><p class="preview">The numbers show how many pending explanations are waiting on your account — sample data in this preview. Reporting a suspected false alarm is done from the alert itself, in the Responder tab.</p>');button('trackReport',reviewTracker);button('reviewCaller',reviewCallerFork);button('reviewResponder',responderReview)}

let trackerResponders=[{name:'Zara Ahmed',phone:'+923001112223',status:'On the way',eta:'6 minutes',loc:'31.5225,74.3610'},{name:'Hamza Iqbal',phone:'+923214445566',status:'On the way',eta:'9 minutes',loc:'31.5195,74.3550'}];
function reviewTracker(){const active=trackerResponders.filter(r=>r.status!=='Not needed').length;show('<h2>Your report status</h2><span class="category">'+esc(category)+'</span><div class="status"><h3>'+active+' responder(s) still coming</h3><p class="muted">Preview only — in the real app this updates live as people respond.</p></div>'+trackerResponders.map((r,i)=>'<div class="protected" style="opacity:'+(r.status==='Not needed'?'.55':'1')+'"><strong>'+esc(r.name)+' · Responder</strong><p class="muted">Committed to in-person help · '+r.status+'</p><p>Phone: <a href="tel:'+r.phone+'">'+r.phone+'</a> — call or text to check in.</p><p>Live location: <a class="loc-icon" href="https://www.google.com/maps?q='+r.loc+'" target="_blank" rel="noopener" aria-label="Open '+esc(r.name)+'\'s live location">📍</a>'+(r.status!=='Not needed'?' · ETA '+r.eta:'')+'</p>'+(r.status!=='Not needed'?'<button class="full urgent" id="notNeeded'+i+'">🚫 Cancel this request<br><small style="display:block;font-weight:400;margin-top:4px">Let '+esc(r.name.split(' ')[0])+' know so they can help someone else nearby.</small></button>':'<p class="preview">You cancelled this request — '+esc(r.name.split(' ')[0])+' is now free to help someone else.</p>')+'</div>').join('')+'<p class="preview">Preview only: real-time location sharing needs background location permission and a backend, not implemented here.</p>'+backBtn('Back to review'));trackerResponders.forEach((r,i)=>{const btn=document.getElementById('notNeeded'+i);if(btn)btn.onclick=()=>{r.status='Not needed';reviewTracker()}});button('backNav',reviewHome)}

function reviewCallerFork(){show('<h2>Who were you reporting for?</h2><p class="muted">This does not change how the review works — it just helps the reviewer understand the report.</p><button id="self" class="row">I was the person needing help<small>You experienced the emergency directly.</small></button><button id="witness" class="row">I saw it happen to someone else<small>You raised the alarm on their behalf.</small></button>'+backBtn('Back to review')+'');button('self',()=>cooldown('self'));button('witness',()=>cooldown('witness'));button('backNav',reviewHome)}
function responderReview(){show('<h2>Could not attend?</h2><p>You offered in-person help but your commitment was not completed. Tell the reviewer what prevented you from attending.</p><div class="status"><h3>Account temporarily paused · example</h3><p>A human reviewer will consider your explanation. A Connects fine may apply; this preview does not decide that.</p></div><label>What happened?<textarea id="responderExplanation" placeholder="I could not attend because…"></textarea></label><p id="responderError" class="error" hidden>Please explain what prevented you from attending.</p><button id="sendResponderExplanation" class="full primary">Send my explanation · preview</button>'+backBtn('Back to review')+'');button('backNav',reviewHome);button('sendResponderExplanation',()=>{if(!document.getElementById('responderExplanation').value.trim()){document.getElementById('responderError').hidden=false;return}show('<h2>Explanation submitted · preview</h2><p>A human reviewer will consider what happened. No fine or final account decision has been issued in this preview.</p>'+backBtn('Back to review'));button('backNav',reviewHome)})}


button('exit',picker);button('caller',picker);button('responder',incoming);button('review',reviewHome);picker();
